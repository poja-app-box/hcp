AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: hcp-37762aa0 - Computation and API

Globals:
  Function:
    # CodeUri, Runtime and Architectures are per-function now: the workers are
    # PackageType Image, which rejects the first two and needs x86_64.
    Tracing: Active
    EventInvokeConfig:
      MaximumRetryAttempts: 0
    Environment:
      Variables:
        ENV: !Ref Env
        AWS_SES_SOURCE: noreply@poja.io
        AWS_EVENTBRIDGE_BUS: !Sub '{{resolve:ssm:/hcp-37762aa0/${Env}/eventbridge/bus-name}}'
        AWS_EVENT_STACK_1_SQS_QUEUE_URL: !Sub '{{resolve:ssm:/hcp-37762aa0/${Env}/1/sqs/mailbox-queue-url}}'
        AWS_EVENT_STACK_2_SQS_QUEUE_URL: !Sub '{{resolve:ssm:/hcp-37762aa0/${Env}/2/sqs/mailbox-queue-url}}'
        SPRING_DATASOURCE_URL: !Sub '{{resolve:ssm:/hcp-37762aa0/${Env}/db/url}}'
        SPRING_DATASOURCE_USERNAME: !Sub '{{resolve:ssm:/hcp-37762aa0/${Env}/db/user/username}}'
        SPRING_DATASOURCE_PASSWORD: !Sub '{{resolve:ssm:/hcp-37762aa0/${Env}/db/user/password}}'
        JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Dspring.main.lazy-initialization=true -Dspring.data.jpa.repositories.bootstrap-mode=lazy -Dspring.datasource.max-active=5 -Dspring.datasource.max-idle=1 -Dspring.datasource.min-idle=1 -Dspring.datasource.initial-size=1

Parameters:
  Env:
    Type: String
  # Both workers run the identical image. Letting sam build it per function would
  # push two byte-identical copies to two ECR repositories, so CI builds and pushes
  # it once and passes the tag in here instead.
  WorkerImageUri:
    Type: String

Resources:
  FrontalFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Stays a zip: it only publishes events, never drives a browser, so it keeps
      # arm64's cheaper GB-second rate and remains eligible for SnapStart.
      CodeUri: .
      Runtime: java21
      Architectures:
        - arm64
      Handler: io.poja.health.handler.LambdaHandler::handleRequest
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt ExecutionRole.Arn
      FunctionName: !Sub
        - ${Env}-hcp-37762aa0-FrontalFunction-${Uid}
        - Uid: !Select [ 0, !Split [ '-', !Select [ 2, !Split [ /, !Ref AWS::StackId ] ] ] ]
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      ReservedConcurrentExecutions: 5

  WorkerFunction1:
    Type: AWS::Serverless::Function
    Properties:
      # Not settable through Globals, unlike Tracing and Environment.
      PackageType: Image
      ImageUri: !Ref WorkerImageUri
      Architectures:
        - x86_64 # the Playwright image's arm64 variant is experimental
      ImageConfig:
        Command:
          - io.poja.health.handler.MailboxEventHandler::handleRequest
      MemorySize: 2048 # Chromium wants the CPU that comes with it
      Timeout: 600 #note(sqs-visibility)
      Role: !GetAtt ExecutionRole.Arn
      FunctionName: !Sub
        - ${Env}-hcp-37762aa0-WorkerFunction1-${Uid}
        - Uid: !Select [ 0, !Split [ '-', !Select [ 2, !Split [ /, !Ref AWS::StackId ] ] ] ]
      Events:
        AllEvents:
          Type: SQS
          Properties:
            Queue: !Sub '{{resolve:ssm:/hcp-37762aa0/${Env}/1/sqs/mailbox-queue-arn}}'
            BatchSize: 5
      ReservedConcurrentExecutions: 5
      EphemeralStorage:
        Size: 1024

  WorkerFunction2:
    Type: AWS::Serverless::Function
    Properties:
      # Not settable through Globals, unlike Tracing and Environment.
      PackageType: Image
      ImageUri: !Ref WorkerImageUri
      Architectures:
        - x86_64 # the Playwright image's arm64 variant is experimental
      ImageConfig:
        Command:
          - io.poja.health.handler.MailboxEventHandler::handleRequest
      MemorySize: 2048 # Chromium wants the CPU that comes with it
      Timeout: 600 #note(sqs-visibility)
      Role: !GetAtt ExecutionRole.Arn
      FunctionName: !Sub
        - ${Env}-hcp-37762aa0-WorkerFunction2-${Uid}
        - Uid: !Select [ 0, !Split [ '-', !Select [ 2, !Split [ /, !Ref AWS::StackId ] ] ] ]
      Events:
        AllEvents:
          Type: SQS
          Properties:
            Queue: !Sub '{{resolve:ssm:/hcp-37762aa0/${Env}/2/sqs/mailbox-queue-arn}}'
            BatchSize: 5
      ReservedConcurrentExecutions: 5
      EphemeralStorage:
        Size: 1024

  FrontalFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /aws/lambda/${Env}-hcp-37762aa0-FrontalFunction-${Uid}
        - Uid: !Select [ 0, !Split [ '-', !Select [ 2, !Split [ /, !Ref AWS::StackId ] ] ] ]

  WorkerFunction1LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /aws/lambda/${Env}-hcp-37762aa0-WorkerFunction1-${Uid}
        - Uid: !Select [ 0, !Split [ '-', !Select [ 2, !Split [ /, !Ref AWS::StackId ] ] ] ]

  WorkerFunction2LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /aws/lambda/${Env}-hcp-37762aa0-WorkerFunction2-${Uid}
        - Uid: !Select [ 0, !Split [ '-', !Select [ 2, !Split [ /, !Ref AWS::StackId ] ] ] ]

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub
            - ${Env}-hcp-37762aa0-ExecutionRole-Policy-${Uid}
            - Uid: !Select [ 0, !Split [ '-', !Select [ 2, !Split [ /, !Ref AWS::StackId ] ] ] ]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                Action:
                  - logs:CreateLogGroup
                Resource: '*'

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt FrontalFunctionLogGroup.Arn
                  - !GetAtt WorkerFunction1LogGroup.Arn
                  - !GetAtt WorkerFunction2LogGroup.Arn

              # Tracing: Active
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

              # Condition must track AWS_SES_SOURCE above.
              - Effect: Allow
                Action:
                  - ses:SendRawEmail
                Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
                Condition:
                  StringEquals:
                    ses:FromAddress: noreply@poja.io

              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Env}-hcp-37762aa0'

              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource:
                  - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Env}-1-hcp-37762aa0'
                  - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Env}-2-hcp-37762aa0'

  ApiUrlSSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join [ '', [ /hcp-37762aa0/, !Ref Env, /api/url ] ]
      Type: String
      Value: !GetAtt FrontalFunctionUrl.FunctionUrl

Outputs:
  ApiUrl:
    Description: Url to access the frontal function
    Value: !GetAtt FrontalFunctionUrl.FunctionUrl
