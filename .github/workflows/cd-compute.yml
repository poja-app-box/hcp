name: CD compute

on:
  push:
    branches:
      - 'prod'
      - 'preprod'

  workflow_dispatch:
    inputs:
      run_tests:
        type: choice
        required: false
        default: 'yes'
        description: Run tests?
        options:
          - 'yes'
          - 'no'

  workflow_call:

jobs:
  deploy-api:
    if: ${{ github.ref_name == 'prod' || github.ref_name == 'preprod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_REGION: eu-west-3
      

    steps:
      - uses: actions/checkout@v4.1.6

      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: hei-school/aws-credentials-setter@v1.0.3
        with:
          secrets: ${{ toJSON(secrets) }}
          region: ${{ env.AWS_REGION }}

      - name: Disable tests
        if: ${{ github.event.inputs.run_tests == 'no' }}
        run: |
          printf "tasks.named('test').configure {\n    enabled = false\n}" >> build.gradle

      - name: Extract Gradle distribution version
        run: |
          url=$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties || true)
          version=${url##*/gradle-}
          version=${version%-bin.zip}
          version=${version%-all.zip}
          case "$version" in
            [0-9]*) ;;
            *) version='' ;;
          esac
          if [ -z "$version" ]; then
            echo "No Gradle version found in gradle-wrapper.properties, letting Gradle pick its own version"
          fi
          echo "GRADLE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Pin the Gradle wrapper
        run: |
          if [ -n "$GRADLE_VERSION" ]; then
            gradle wrapper --gradle-version "$GRADLE_VERSION"
          else
            gradle wrapper
          fi

      - run: sam build

      - name: Deploy application
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name ${{ github.ref_name }}-compute-hcp-37762aa0 --capabilities CAPABILITY_IAM --parameter-overrides Env=${{ github.ref_name }} --resolve-s3 --tags app=hcp-37762aa0 env=${{ github.ref_name }} user:poja=hcp-37762aa0

